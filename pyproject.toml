[project]
name = "test-slms"
version = "0.1.0"
description = "Experimentos reproducibles de generación de problemas matemáticos con SLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6,<8",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "typer>=0.27.3",
]

[project.optional-dependencies]
train = [
    "accelerate>=1,<2",
    "datasets>=3,<5",
    "peft>=0.17,<1",
    "torch>=2.6,<3",
    "transformers>=4.56,<5",
]
infer = [
    "huggingface-hub>=0.36,<1",
    "pandas>=2,<4",
    "torch==2.9.1 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "torchaudio==2.9.1 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "torchvision==0.24.1 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "vllm==0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# GX10/GB10: PyPI's ARM64 torch 2.9.1 is CPU-only. Use the official
# CUDA 13 builds as a coherent set, without changing the x86_64 environment.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
vllm = [{ url = "https://github.com/vllm-project/vllm/releases/download/v0.15.1/vllm-0.15.1%2Bcu130-cp38-abi3-manylinux_2_35_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
